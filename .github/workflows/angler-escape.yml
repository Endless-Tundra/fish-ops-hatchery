name: Angler-Escape

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        component: [frontend, backend, db]
    env:
      IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-${{ matrix.component }}:${{ github.run_id }}
      TRIVY_DISABLE_VEX_NOTICE: "true"

    steps:
      - name: checkout_repo
        uses: actions/checkout@v4

      - name: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: gcloud_auth_docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      ## Install Trivy ##
      - name: install_trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.70.0
        with:
          version: v0.70.0
          cache: true
      
      ## Updates and stores the Trivy Cache once a day ##
      - name: trivy_date
        id: trivy_date
        run: echo "day=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: trivy_db_cache
        id: trivy_db
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy_date.outputs.day }}
          restore-keys: trivy-db-

      ## Install Buildx ##
      - name: install_buildx
        uses: docker/setup-buildx-action@v3

      ## Build Image ##
      - name: build_${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: apps/angler-escape/
          file: apps/angler-escape/Dockerfile-${{ matrix.component }}
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      ## CVE Scan with Trivy ##
      - name: scan_${{ matrix.component }}
        env:
          TRIVY_SKIP_DB_UPDATE: ${{ steps.trivy_db.outputs.cache-hit == 'true' }}
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed $IMAGE

      - name: push_${{ matrix.component }}
        run: docker push $IMAGE

  deploy:
    needs: build-scan-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FRONTEND_IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-frontend:${{ github.run_id }}
      BACKEND_IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-backend:${{ github.run_id }}
      DB_IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-db:${{ github.run_id }}

    steps:
      - name: checkout_deploy
        uses: actions/checkout@v4

      - name: install_terraform_deploy
        uses: hashicorp/setup-terraform@v3

      - name: gcp_auth_deploy
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: tf_init
        run: terraform -chdir=terraform/angler-escape init

      - name: tf_apply
        run: |
          terraform -chdir=terraform/angler-escape apply -auto-approve \
            -var="frontend_image=$FRONTEND_IMAGE" \
            -var="backend_image=$BACKEND_IMAGE" \
            -var="db_image=$DB_IMAGE"

      - name: smoke_test
        run: |
          URL=$(terraform -chdir=terraform/angler-escape output -raw service_url)
          curl --fail --retry 5 --retry-delay 5 "$URL"
          curl -X POST "https://fish-ops-site-782390899175.us-central1.run.app/api/deploy/${{ github.run_id }}/result" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"service_url\": \"$URL\"}"

      - name: cleanup_old_images
        if: success()
        env:
          KEEP: "1"
        run: |
          for COMPONENT in frontend backend db; do
            PACKAGE="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-$COMPONENT"
            gcloud artifacts docker images list "$PACKAGE" \
              --sort-by=~CREATE_TIME \
              --format='value(version)' \
            | tail -n +$((KEEP + 1)) \
            | while read -r DIGEST; do
                echo "Deleting $PACKAGE@$DIGEST"
                gcloud artifacts docker images delete "$PACKAGE@$DIGEST" --delete-tags --quiet
              done
          done