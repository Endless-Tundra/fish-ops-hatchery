name: Angler-Escape

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Build 3 containers, deploy, then self-destruct after 10 minutes
    env:
      FRONTEND_IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-frontend:${{ github.run_id }}
      BACKEND_IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-backend:${{ github.run_id }}
      DB_IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-db:${{ github.run_id }}
      TRIVY_DISABLE_VEX_NOTICE: "true"

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup_terraform
        uses: hashicorp/setup-terraform@v3

      - name: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: setup_trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.70.0
        with:
          version: v0.70.0
          cache: true

      - name: tf_init
        run: terraform -chdir=terraform/angler-escape init

      - name: tf_plan
        run: |
          terraform -chdir=terraform/angler-escape plan -out=tfplan \
            -var="frontend_image=$FRONTEND_IMAGE" \
            -var="backend_image=$BACKEND_IMAGE" \
            -var="db_image=$DB_IMAGE"

      - name: gcloud_auth_docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # # ---- Build and Scan all three images ----
      - name: build_frontend
        run: docker build -f apps/angler-escape/Dockerfile-frontend -t $FRONTEND_IMAGE apps/angler-escape/
      
      - name: scan_frontend
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed $FRONTEND_IMAGE

      - name: build_backend
        run: docker build -f apps/angler-escape/Dockerfile-backend -t $BACKEND_IMAGE apps/angler-escape/
      
      - name: scan_backend
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed $BACKEND_IMAGE

      - name: build_db
        run: docker build -f apps/angler-escape/Dockerfile-db -t $DB_IMAGE apps/angler-escape/

      - name: scan_db
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed $DB_IMAGE


      # # ---- Push to GCP ----
      - name: push_frontend
        run: docker push $FRONTEND_IMAGE
      - name: push_backend
        run: docker push $BACKEND_IMAGE
      - name: push_db
        run: docker push $DB_IMAGE

      ## Terraform Create Cloud Run Containers ##
      - name: tf_apply
        run: |
          terraform -chdir=terraform/angler-escape apply -auto-approve \
            -var="frontend_image=$FRONTEND_IMAGE" \
            -var="backend_image=$BACKEND_IMAGE" \
            -var="db_image=$DB_IMAGE"

      - name: smoke_test
        run: |
          URL=$(terraform -chdir=terraform/angler-escape output -raw service_url)
          curl --fail --retry 5 --retry-delay 5 "$URL"
          curl -X POST "https://fish-ops-site-782390899175.us-central1.run.app/api/deploy/${{ github.run_id }}/result" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"service_url\": \"$URL\"}"
