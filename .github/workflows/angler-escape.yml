name: Angler-Escape

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-and-expire:
    runs-on: ubuntu-latest
    name: Build 3 containers, deploy, then self-destruct after 10 minutes
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup_terraform
        uses: hashicorp/setup-terraform@v3

      - name: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: tf_init
        run: terraform -chdir=terraform/angler-escape init

      - name: tf_plan
        run: |
          terraform -chdir=terraform/angler-escape plan -out=tfplan \
            -var="frontend_image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-frontend:${{ github.run_id }}" \
            -var="backend_image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-backend:${{ github.run_id }}" \
            -var="db_image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-db:${{ github.run_id }}"

      - name: gcloud_auth_docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # # ---- build all three images ----
      - name: build_frontend
        run: docker build -f apps/angler-escape/Dockerfile-frontend -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-frontend:${{ github.run_id }} apps/angler-escape/
      - name: build_backend
        run: docker build -f apps/angler-escape/Dockerfile-backend -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-backend:${{ github.run_id }} apps/angler-escape/
      - name: build_db
        run: docker build -f apps/angler-escape/Dockerfile-db -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-db:${{ github.run_id }} apps/angler-escape/

      # ---- Vulnerability Scans ----
      - name: security_scan_frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          ignore-unfixed: true
          image-ref: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-frontend:${{ github.run_id }}
          exit-code: "1"
          severity: CRITICAL,HIGH
      - name: security_scan_backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          ignore-unfixed: true
          image-ref: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-backend:${{ github.run_id }}
          exit-code: "1"
          severity: CRITICAL,HIGH
      - name: security_scan_db
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          ignore-unfixed: true
          image-ref: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-db:${{ github.run_id }}
          exit-code: "1"
          severity: CRITICAL,HIGH

      # # ---- Push to GCP ----
      - name: push_frontend
        run: docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-frontend:${{ github.run_id }}
      - name: push_backend
        run: docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-backend:${{ github.run_id }}
      - name: push_db
        run: docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-db:${{ github.run_id }}

      ## Terraform Create Cloud Run Containers ##
      - name: tf_apply
        run: |
          terraform -chdir=terraform/angler-escape apply -auto-approve \
            -var="frontend_image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-frontend:${{ github.run_id }}" \
            -var="backend_image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-backend:${{ github.run_id }}" \
            -var="db_image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/angler-escape-db:${{ github.run_id }}"

      - name: smoke_test
        run: |
          URL=$(terraform -chdir=terraform/angler-escape output -raw service_url)
          curl --fail --retry 5 --retry-delay 5 "$URL"