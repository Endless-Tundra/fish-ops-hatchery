name: Build and Deploy Ephemeral Game Stack

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-and-expire:
    runs-on: ubuntu-latest
    name: Build 3 containers, deploy, then self-destruct after 10 minutes
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup_terraform
        uses: hashicorp/setup-terraform@v3

      - name: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: tf_init
        working-directory: ./terraform/angler-escape
        run: terraform -chdir=terraform init

      - name: tf_plan
        working-directory: ./terraform/angler-escape
        run: |
          terraform -chdir=terraform plan -out=tfplan \
            -var="frontend_image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/angler-escape-images/frontend:${{ github.run_id }}" \
            -var="backend_image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/angler-escape-images/backend:${{ github.run_id }}" \
            -var="redis_image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/angler-escape-images/redis:${{ github.run_id }}"

      - name: gcloud_auth_docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # ---- build all three images ----
      - name: build_frontend
        run: docker build -f Dockerfile.frontend -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/angler-escape-images/frontend:${{ github.run_id }} .
      - name: build_backend
        run: docker build -f Dockerfile.backend -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/angler-escape-images/backend:${{ github.run_id }} .
      - name: build_redis
        run: docker build -f Dockerfile.db -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/angler-escape-images/redis:${{ github.run_id }} .

      # ---- scan all three before any of them can be pushed ----
      # SHA-pin this in real use -- see the tutorial's note on why tags
      # alone aren't trustworthy for third-party actions.
      - name: security_scan_frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          image-ref: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/angler-escape-images/frontend:${{ github.run_id }}
          exit-code: "1"
          severity: CRITICAL,HIGH
      - name: security_scan_backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          image-ref: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/angler-escape-images/backend:${{ github.run_id }}
          exit-code: "1"
          severity: CRITICAL,HIGH
      - name: security_scan_redis
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          image-ref: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/angler-escape-images/redis:${{ github.run_id }}
          exit-code: "1"
          severity: CRITICAL,HIGH

      # ---- only reachable if every scan passed ----
      - name: push_frontend
        run: docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/angler-escape-images/frontend:${{ github.run_id }}
      - name: push_backend
        run: docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/angler-escape-images/backend:${{ github.run_id }}
      - name: push_redis
        run: docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/angler-escape-images/redis:${{ github.run_id }}

      - name: tf_apply
        working-directory: ./terraform/angler-escape
        run: |
          terraform -chdir=terraform apply -auto-approve \
            -var="frontend_image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/angler-escape-images/frontend:${{ github.run_id }}" \
            -var="backend_image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/angler-escape-images/backend:${{ github.run_id }}" \
            -var="redis_image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/angler-escape-images/redis:${{ github.run_id }}"

      - name: smoke_test
        run: |
          URL=$(terraform -chdir=terraform output -raw service_url)
          curl --fail --retry 5 --retry-delay 5 "$URL"