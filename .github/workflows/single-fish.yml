name: Single-Fish

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: string

permissions:
  id-token: write   # required for Workload Identity Federation
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      ## Install Terraform 
      - name: setup_terraform
        uses: hashicorp/setup-terraform@v3

      ## Checkout the Repo
      - name: checkout
        uses: actions/checkout@v4

      - name: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: tf_init
        run: terraform -chdir=terraform/single-fish init -backend-config="prefix=${{ inputs.service }}"

      - name: tf_plan
        run: terraform -chdir=terraform/single-fish plan -out=tfplan -var="container_image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/${{ inputs.service }}:${{ github.run_id }}"

      - name: build_image
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -f apps/angler-escape/Dockerfile-${{ inputs.service }}" -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/${{ inputs.service }}:${{ github.run_id }} apps/single-fish/

      - name: security_scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          ignore-unfixed: true
          image-ref: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/${{ inputs.service }}:${{ github.run_id }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: push_image
        run: docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/${{ inputs.service }}:${{ github.run_id }}

      - name: tf_apply
        run: |
          terraform -chdir=terraform/single-fish apply -auto-approve \
            -var="container_image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/${{ inputs.service }}:${{ github.run_id }}"

      - name: smoke_test
        run: |
          URL=$(terraform -chdir=terraform output -raw service_url)
          curl --fail --retry 5 --retry-delay 5 "$URL"