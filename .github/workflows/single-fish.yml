name: Single-Fish

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: string

permissions:
  id-token: write   # required for Workload Identity Federation
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      ## Checkout the Repo
      - name: checkout_repo
        uses: actions/checkout@v4

      ## Auth for GCP ##
      - name: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: gcp_auth_docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      ## Install Terraform and Buildx
      - name: install_terraform
        uses: hashicorp/setup-terraform@v3

      - name: install_buildx
        uses: docker/setup-buildx-action@v3

      ## Build Image ##
      - name: build_image
        uses: docker/build-push-action@v6
        with:
          context: apps/single-fish/
          file: apps/single-fish/Dockerfile-${{ inputs.service }}
          tags: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/${{ inputs.service }}:${{ github.run_id }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      ## CVE Scan with Trivy ##
      - name: security_scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          ignore-unfixed: true
          image-ref: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/${{ inputs.service }}:${{ github.run_id }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      ## Push to GCP ##
      - name: push_image
        run: docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/${{ inputs.service }}:${{ github.run_id }}

      ## Terraform Run ##
      - name: tf_init
        run: terraform -chdir=terraform/single-fish init -backend-config="prefix=${{ inputs.service }}"

      - name: tf_apply
        run: |
          terraform -chdir=terraform/single-fish apply -auto-approve -var="container_image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/${{ inputs.service }}:${{ github.run_id }}" -var="service=${{ inputs.service }}" -var="invoker_service_account=github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

      - name: smoke_test
        run: |
          SERVICE=$(terraform -chdir=terraform/single-fish output -raw service_name)
          for i in $(seq 1 4); do
            STATUS=$(gcloud run services describe "$SERVICE" \
              --region "us-central1" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --format=json)
            READY=$(echo "$STATUS" | jq -r '.status.conditions[] | select(.type=="Ready") | .status')
            LATEST_CREATED=$(echo "$STATUS" | jq -r '.status.latestCreatedRevisionName')
            LATEST_READY=$(echo "$STATUS" | jq -r '.status.latestReadyRevisionName')
            if [ "$READY" = "True" ] && [ "$LATEST_CREATED" = "$LATEST_READY" ]; then
              echo "Service $SERVICE is ready on revision $LATEST_READY"
              exit 0
            fi
            echo "Not ready yet (Ready=$READY), retrying..."
            sleep 3
          done
          echo "Service never became ready"
          exit 1

      - name: cleanup_old_images
        if: success()
        env:
          PACKAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fish-ops-images/${{ inputs.service }}
          KEEP: "2"
        run: |
          gcloud artifacts docker images list "$PACKAGE" \
            --sort-by=~CREATE_TIME \
            --format='value(version)' \
          | tail -n +$((KEEP + 1)) \
          | while read -r DIGEST; do
              echo "Deleting $PACKAGE@$DIGEST"
              gcloud artifacts docker images delete "$PACKAGE@$DIGEST" --delete-tags --quiet
            done