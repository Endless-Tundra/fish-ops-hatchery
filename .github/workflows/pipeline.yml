name: pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for Workload Identity Federation
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      ## Install Terraform 
      - name: setup_terraform
        uses: hashicorp/setup-terraform@v3

      ## Checkout the Repo
      - name: checkout
        uses: actions/checkout@v4

      - name: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/782390899175/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@project-95dc5755-7684-4706-bf5.iam.gserviceaccount.com

      - name: tf_init
        run: terraform -chdir=terraform init

      - name: tf_plan
        run: terraform -chdir=terraform plan -out=tfplan -var="container_image=us-central1-docker.pkg.dev/project-95dc5755-7684-4706-bf5/fish-ops-images/ephemeral:${{ github.run_id }}"

      - name: build_image
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -t us-central1-docker.pkg.dev/project-95dc5755-7684-4706-bf5/fish-ops-images/ephemeral:${{ github.run_id }} app/
          docker push us-central1-docker.pkg.dev/project-95dc5755-7684-4706-bf5/fish-ops-images/ephemeral:${{ github.run_id }}

      - name: tf_apply
        run: |
          terraform -chdir=terraform apply -auto-approve \
            -var="container_image=us-central1-docker.pkg.dev/project-95dc5755-7684-4706-bf5/fish-ops-images/ephemeral:${{ github.run_id }}"

      - name: smoke_test
        run: |
          URL=$(terraform -chdir=terraform output -raw service_url)
          curl --fail --retry 5 --retry-delay 5 "$URL"